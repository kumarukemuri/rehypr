[config]
# ...

[templates.papirus]
input_path = '~/.config/matugen/templates/papirus-primary'
output_path = '~/.cache/rehypr/papirus-primary'
post_hook = 'python3 "$HOME/.config/matugen/scripts/papirus.py" "$HOME/.cache/rehypr/papirus-primary" --activate'

[templates.hyprland]
input_path  = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/config/colors.lua"

[templates.hyprlock]
input_path  = "~/.config/matugen/templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors.conf"

[templates.waybar]
input_path  = "~/.config/matugen/templates/colors.css"
output_path = "~/.config/waybar/colors.css"
#post_hook   = "pkill -SIGUSR2 waybar"

[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"
#post_hook   = "pkill -SIGUSR1 kitty"

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.local/share/themes/adw-gtk3/gtk-3.0/colors.css'

[templates.gtk3-dark]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.local/share/themes/adw-gtk3-dark/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.local/share/themes/adw-gtk3/gtk-4.0/colors.css'

[templates.gtk4-dark]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.local/share/themes/adw-gtk3-dark/gtk-4.0/colors.css'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.mako]
input_path = '~/.config/matugen/templates/mako'
output_path = '~/.config/mako/mako-colors'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.vesktop]
input_path = '~/.config/matugen/templates/midnight-discord.css'
output_path = '~/.config/vesktop/themes/midnight-discord.css'

[templates.swayosd]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/swayosd/colors.css'
